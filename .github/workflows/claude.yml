# .github/workflows/claude.yml
# Claude Code agent triggered by @claude mentions in issues and PRs.
# Auth: Claude Pro/Max OAuth token (CLAUDE_CODE_OAUTH_TOKEN secret).
# Tools wired in: Asta plugins (Allen AI), Edison Scientific, CHPC (Univ. of Utah).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when @claude is mentioned
    # PUBLIC REPO: only owners/members/collaborators may trigger the agent.
    # Without this gate, anyone on GitHub could open an issue and run the
    # agent on the repo owner's credentials with bypassPermissions.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Edison Scientific platform API key (get from platform.edisonscientific.com)
          EDISON_PLATFORM_API_KEY: ${{ secrets.EDISON_PLATFORM_API_KEY }}
          # Asta (Allen AI) refresh token. Generate locally with:
          #   asta auth login
          #   asta auth print-token --raw --refresh
          ASTA_TOKEN: ${{ secrets.ASTA_TOKEN }}
          # CHPC (University of Utah) credentials for agent-driven SSH/SLURM jobs
          CHPC_USERNAME: ${{ secrets.CHPC_USERNAME }}
          CHPC_PASSWORD: ${{ secrets.CHPC_PASSWORD }}
          # Allow long-blocking foreground commands (e.g., Edison polling)
          BASH_DEFAULT_TIMEOUT_MS: "900000"  # 15 min default per Bash call
          BASH_MAX_TIMEOUT_MS: "3600000"     # 60 min ceiling per Bash call
        with:
          # Pro/Max subscription auth. Generate with: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Install the Allen AI Asta plugins (Theorizer, AutoDiscovery, etc.)
          plugin_marketplaces: |
            https://github.com/allenai/asta-plugins.git
          plugins: |
            asta-tools@asta-plugins
            asta-flows@asta-plugins
          # Print the full turn-by-turn JSON execution log in the step output
          show_full_output: true
          # Render a human-readable "Claude Code Report" in the job's Step Summary
          display_report: true
          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          # Model + permissions. bypassPermissions = no confirmation prompts.
          # Only use in repos where you trust everyone with write access!
          claude_args: |
            --model claude-fable-5
            --permission-mode bypassPermissions

      # Recommended if show_full_output is true
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
